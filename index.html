        }

            opacity: 0.7;
        }

        .feedback {
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            display: none; /* Initially hidden */
        }

        .feedback.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

            color: white;

        const quizContainerMCQ = document.getElementById('quiz-container');
        const quizContainerTF = document.getElementById('true-false-container');

        // Function to display questions
        function displayQuiz(quizData, container, startIndex) {
            quizData.forEach((qData, index) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');
                questionBlock.setAttribute('data-question-index', startIndex + index);

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                questionText.innerHTML = `${startIndex + index + 1}. ${qData.question}`;
                questionBlock.appendChild(questionText);

                const optionsDiv = document.createElement('div');
                optionsDiv.classList.add('options');

                const options = qData.options;

                options.forEach(option => {
                    const button = document.createElement('button');
                    button.innerHTML = option;
                    button.addEventListener('click', handleAnswer);
                    optionsDiv.appendChild(button);
                });

                questionBlock.appendChild(optionsDiv);

                const feedbackDiv = document.createElement('div');
                feedbackDiv.classList.add('feedback');
                questionBlock.appendChild(feedbackDiv);

                container.appendChild(questionBlock);
            });
        }

        // Function to handle answer selection
        function handleAnswer(event) {
            const selectedButton = event.target;
            const selectedAnswer = selectedButton.textContent;
            const questionBlock = selectedButton.closest('.question-block');
            // Find the correct quiz data array and question index
            const questionIndex = parseInt(questionBlock.getAttribute('data-question-index'), 10);

            let currentQuizData;
            if (questionIndex < quizDataMCQ.length) {
                currentQuizData = quizDataMCQ;
            } else {
                currentQuizData = quizDataTF;
            }

            const correctAnswer = currentQuizData[questionIndex - (questionIndex < quizDataMCQ.length ? 0 : quizDataMCQ.length)].answer;
            const feedbackDiv = questionBlock.querySelector('.feedback');
            const optionButtons = questionBlock.querySelectorAll('.options button');

            optionButtons.forEach(button => {
                button.disabled = true;
            });

            selectedButton.classList.add('selected');

            if (selectedAnswer === correctAnswer) {
                selectedButton.classList.add('correct');
                feedbackDiv.textContent = 'Correct!';
                feedbackDiv.classList.add('correct');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackDiv.textContent = `Incorrect. The correct answer is: ${correctAnswer}`;
                feedbackDiv.classList.add('incorrect');

                 optionButtons.forEach(button => {
                    if (button.textContent === correctAnswer) {
                        button.classList.add('reveal-correct');
                    }
                });
            }
             feedbackDiv.style.display = 'block';
        }

        // Initial call to display the quiz when the page loads
        displayQuiz(quizDataMCQ, quizContainerMCQ, 0);
        displayQuiz(quizDataTF, quizContainerTF, quizDataMCQ.length);
