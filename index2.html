        const mcqContainer = document.getElementById('multiple-choice-questions');
        const tfContainer = document.getElementById('true-false-questions');
        const essayContainer = document.getElementById('essay-questions');

        let currentQuestionNumber = 1;

        // Function to display questions (MCQ and True/False)
        function displayInteractiveQuestions(questions, container) {
            questions.forEach((qData) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                questionText.innerHTML = `${currentQuestionNumber}. ${qData.question}`;
                questionBlock.appendChild(questionText);

                const optionsDiv = document.createElement('div');
                optionsDiv.classList.add('options');

                qData.options.forEach(option => {
                    const button = document.createElement('button');
                    button.innerHTML = option;
                    button.addEventListener('click', handleAnswer);
                    optionsDiv.appendChild(button);
                });

                questionBlock.appendChild(optionsDiv);

                const feedbackDiv = document.createElement('div');
                feedbackDiv.classList.add('feedback');
                questionBlock.appendChild(feedbackDiv);

                container.appendChild(questionBlock);
                currentQuestionNumber++;
            });
        }

         // Function to display Essay Questions
         function displayEssayQuestions(questions, container) {
            questions.forEach((qData) => {
                const questionBlock = document.createElement('div');
                questionBlock.classList.add('question-block');

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                questionText.innerHTML = `${currentQuestionNumber}. ${qData.question}`;
                questionBlock.appendChild(questionText);

                const toggleButton = document.createElement('button');
                toggleButton.classList.add('essay-answer-toggle');
                toggleButton.textContent = 'Show Answer';
                questionBlock.appendChild(toggleButton);

                const answerContent = document.createElement('div');
                answerContent.classList.add('essay-answer-content');
                answerContent.innerHTML = qData.answer; // Use innerHTML for potential formatting
                questionBlock.appendChild(answerContent);

                container.appendChild(questionBlock);
                currentQuestionNumber++;
            });
         }


        // Function to handle answer selection for MCQ and True/False
        function handleAnswer(event) {
            const selectedButton = event.target;
            const selectedAnswer = selectedButton.textContent;
            const questionBlock = selectedButton.closest('.question-block');
            const questionTextElement = questionBlock.querySelector('.question-text');
            const questionNumber = parseInt(questionTextElement.textContent.split('.')[0], 10);

            // Find the correct question data based on the question number
            let qData = null;
            let questionIndex = -1;

            // Check MCQ first
            if (questionNumber <= quizData.mcq.length) {
                qData = quizData.mcq[questionNumber - 1];
                questionIndex = questionNumber - 1;
            } else {
                // Check True/False
                const tfQuestionNumber = questionNumber - quizData.mcq.length;
                 if (tfQuestionNumber <= quizData.tf.length) {
                     qData = quizData.tf[tfQuestionNumber - 1];
                     questionIndex = tfQuestionNumber - 1;
                 }
            }


            if (!qData) {
                console.error("Question data not found for question number:", questionNumber);
                return;
            }

            const correctAnswer = qData.answer;
            const feedbackDiv = questionBlock.querySelector('.feedback');
            const optionButtons = questionBlock.querySelectorAll('.options button');

            // Disable all buttons for this question
            optionButtons.forEach(button => {
                button.disabled = true;
            });

            // Mark the selected button
            selectedButton.classList.add('selected');

            // Check if the answer is correct
            if (selectedAnswer.trim() === correctAnswer.trim()) { // Use trim to handle potential whitespace
                selectedButton.classList.add('correct');
                feedbackDiv.textContent = 'Correct!';
                feedbackDiv.classList.add('correct');
            } else {
                selectedButton.classList.add('incorrect');
                feedbackDiv.textContent = `Incorrect. The correct answer is: ${correctAnswer}`;
                feedbackDiv.classList.add('incorrect');

                // Highlight the correct answer button
                 optionButtons.forEach(button => {
                    if (button.textContent.trim() === correctAnswer.trim()) { // Use trim here too
                        button.classList.add('reveal-correct');
                    }
                });
            }
             feedbackDiv.style.display = 'block';
        }

        // Function to handle essay answer toggle
        function handleEssayToggle(event) {
             const toggleButton = event.target;
             const answerContent = toggleButton.nextElementSibling; // Get the next sibling element (the answer-content div)

             if (answerContent.style.display === 'block') {
                 answerContent.style.display = 'none';
                 toggleButton.textContent = 'Show Answer';
             } else {
                 answerContent.style.display = 'block';
                 toggleButton.textContent = 'Hide Answer';
             }
        }


        // Initial call to display the questions when the page loads
        displayInteractiveQuestions(quizData.mcq, mcqContainer);
        displayInteractiveQuestions(quizData.tf, tfContainer);
        displayEssayQuestions(quizData.essay, essayContainer);

        // Add event listeners for essay toggles after they are displayed
        document.querySelectorAll('.essay-answer-toggle').forEach(button => {
            button.addEventListener('click', handleEssayToggle);
        });


    </script>
